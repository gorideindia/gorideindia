<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoRide - Available Cars</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cars-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .cars-container > h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #carsList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .car-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
            overflow: hidden;
            transition: 0.3s;
        }

        .car-card:hover {
            transform: translateY(-5px);
        }

        .car-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        .car-card h3 {
            margin: 15px 0 8px;
            font-size: 21px;
        }

        .car-card p {
            margin: 6px 0;
        }

        .car-card .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .car-card button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .view-btn {
            background: #e8f5e9;
        }

        .book-btn {
            background: #0b8f3c;
            color: white;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            padding: 40px;
        }

        .error {
            text-align: center;
            color: red;
            padding: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>GoRide 🚗</h1>
    <p>Drive Freely, Live Fully</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="cars.html">Cars</a>
    <a href="booking.html">Booking</a>
    <a href="login.html">Login</a>
</nav>

<main class="cars-container">

    <h1>Available Cars</h1>

    <div id="carsList">
        <div class="loading">
            Loading cars...
        </div>
    </div>

</main>

<footer>
    <p>© 2026 GoRide. All Rights Reserved.</p>
</footer>


<script>

const API_URL = "https://gorideindia-production.up.railway.app";

async function loadCars() {

    const carsList = document.getElementById("carsList");

    try {

        const response = await fetch(`${API_URL}/cars`);

        if (!response.ok) {
            throw new Error("Unable to load cars");
        }

        const cars = await response.json();

        console.log("Cars received:", cars);

        if (!cars || cars.length === 0) {

            carsList.innerHTML = `
                <div class="error">
                    No cars available.
                </div>
            `;

            return;
        }

        carsList.innerHTML = "";

        cars.forEach(car => {

            const imagePath = car.image
                ? `${API_URL}/${car.image}`
                : `${API_URL}/images/default-car.jpg`;

            const carCard = document.createElement("div");

            carCard.className = "car-card";

            carCard.innerHTML = `

                <img
                    src="${imagePath}"
                    alt="${car.name}"
                    onerror="this.src='${API_URL}/images/default-car.jpg'"
                >

                <h3>${car.name}</h3>

                <p>
                    <strong>₹${Number(car.price).toLocaleString("en-IN")} / Day</strong>
                </p>

                <p>
                    ${car.type || "Car"} | Self Drive
                </p>

                <div class="buttons">

                    <button
                        class="view-btn"
                        onclick="viewDetails('${car.name}')">
                        View Details
                    </button>

                    <button
                        class="book-btn"
                        onclick="bookCar('${car.name}')">
                        Book Now
                    </button>

                </div>
            `;

            carsList.appendChild(carCard);

        });

    } catch (error) {

        console.error("Cars loading error:", error);

        carsList.innerHTML = `
            <div class="error">
                Unable to load cars.<br>
                Please try again.
            </div>
        `;
    }
}


function bookCar(carName) {

    localStorage.setItem("selectedCar", carName);

    window.location.href = "booking.html";
}


function viewDetails(carName) {

    window.location.href =
        "cardetails.html?car=" +
        encodeURIComponent(carName);
}


loadCars();

</script>

</body>
</html>
