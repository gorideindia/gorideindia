<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoRide Booking</title>

    <link rel="stylesheet" href="style.css">

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- GoRide JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <h1>GoRide 🚗</h1>
    <p>Drive Freely, Live Fully</p>
</header>


<nav>
    <a href="index.html">Home</a>
    <a href="cars.html">Cars</a>
    <a href="booking.html">Booking</a>
    <a href="login.html">Login</a>
</nav>


<div class="booking-form">

    <h2>Book Your Ride</h2>


    <!-- CUSTOMER DETAILS -->

    <label for="name">Full Name</label>

    <input
        type="text"
        id="name"
        placeholder="Enter Full Name"
    >


    <label for="mobile">Mobile Number</label>

    <input
        type="tel"
        id="mobile"
        placeholder="Enter 10 Digit Mobile Number"
        maxlength="10"
    >


    <!-- DATE -->

    <label for="pickup">Pickup Date</label>

    <input
        type="date"
        id="pickup"
        onchange="calculateDays()"
    >


    <label for="return">Return Date</label>

    <input
        type="date"
        id="return"
        onchange="calculateDays()"
    >


    <!-- CAR -->

    <label for="car">Select Car</label>

    <select
        id="car"
        onchange="calculatePrice()"
    >

        <option value="">Select Car</option>

        <option value="Tata Punch">
            Tata Punch - ₹1900/day
        </option>

        <option value="Maruti Swift">
            Maruti Swift - ₹1900/day
        </option>

        <option value="Brezza">
            Brezza - ₹2200/day
        </option>

        <option value="Creta">
            Creta - ₹2500/day
        </option>

        <option value="Innova">
            Innova - ₹3000/day
        </option>

    </select>


    <!-- PRICE -->

    <label for="price">Price Per Day</label>

    <input
        type="text"
        id="price"
        readonly
    >


    <label for="days">Total Days</label>

    <input
        type="text"
        id="days"
        readonly
    >


    <label for="total">Total Amount</label>

    <input
        type="text"
        id="total"
        readonly
    >


    <!-- DOCUMENTS -->

    <label for="license">
        Upload Driving Licence
    </label>

    <input
        type="file"
        id="license"
        accept="image/*,.pdf"
    >


    <label for="aadhaar">
        Upload Aadhaar (Optional)
    </label>

    <input
        type="file"
        id="aadhaar"
        accept="image/*,.pdf"
    >


    <!-- BOOKING ID -->

    <label for="bookingId">
        Booking ID
    </label>

    <input
        type="text"
        id="bookingId"
        readonly
        placeholder="Generated after payment"
    >


    <!-- PAYMENT -->

    <button
        type="button"
        onclick="startPayment()"
    >
        Pay Now
    </button>

</div>


<footer>
    <p>
        © 2026 GoRide. All Rights Reserved.
    </p>
</footer>

</body>

</html>
